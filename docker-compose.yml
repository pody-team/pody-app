services:
  article-postgres:
    image: postgres:16-alpine
    container_name: pody-article-postgres
    environment:
      POSTGRES_DB: pody_article
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pody_article"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.0.0
    container_name: pody-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrations:
    build:
      context: ./server
      dockerfile: migrations/Dockerfile
    container_name: pody-migrations
    environment:
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:?IDENTITY_DATABASE_URL is required}
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?NOTIFICATION_DATABASE_URL is required}
      CONTENT_DATABASE_URL: ${CONTENT_DATABASE_URL:?CONTENT_DATABASE_URL is required}
      AI_DATABASE_URL: ${AI_DATABASE_URL:?AI_DATABASE_URL is required}
      ARTICLE_DATABASE_URL: ${ARTICLE_DATABASE_URL:?ARTICLE_DATABASE_URL is required}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-false}
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: pody-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity-service:
    build:
      context: ./server/identity-service
      dockerfile: Dockerfile
    container_name: pody-identity-service
    environment:
      PORT: "8081"
      DATABASE_URL: ${IDENTITY_DATABASE_URL:?IDENTITY_DATABASE_URL is required}
      JWT_SECRET: change-me
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      EMAIL_VERIFICATION_TTL: 24h
      PASSWORD_RESET_TTL: 2h
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: identity-service
      KAFKA_WRITE_TIMEOUT: 5s
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_BATCH_SIZE: "20"
      OUTBOX_RETENTION: 168h
      OUTBOX_CLEANUP_INTERVAL: 1h
      OUTBOX_CLEANUP_BATCH_SIZE: "200"
      VERIFICATION_EVENTS_TOPIC: identity.email.verification.requested
      EMAIL_VERIFICATION_URL_BASE: ${EMAIL_VERIFICATION_URL_BASE:-http://localhost:8080/verify-email/open}
      PASSWORD_RESET_EVENTS_TOPIC: identity.password.reset.requested
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-283249494920-68vd67ss030ik3v5dbruttgsorn30t97.apps.googleusercontent.com}
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  notification-service:
    build:
      context: ./server/notification-service
      dockerfile: Dockerfile
    container_name: pody-notification-service
    environment:
      PORT: "8087"
      INTERNAL_API_KEY: change-me
      EMAIL_SENDER_MODE: ${EMAIL_SENDER_MODE:-log}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@pody.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_INSECURE_SKIP_VERIFY: ${SMTP_INSECURE_SKIP_VERIFY:-false}
      SMTP_DIAL_TIMEOUT: ${SMTP_DIAL_TIMEOUT:-10s}
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?NOTIFICATION_DATABASE_URL is required}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_WRITE_TIMEOUT: 5s
      VERIFICATION_EVENTS_TOPIC: identity.email.verification.requested
      VERIFICATION_RETRY_TOPIC: identity.email.verification.requested.retry
      VERIFICATION_DLQ_TOPIC: identity.email.verification.requested.dlq
      VERIFICATION_CONSUMER_GROUP: notification-service
      VERIFICATION_MAX_ATTEMPTS: "5"
      PASSWORD_RESET_EVENTS_TOPIC: identity.password.reset.requested
      PASSWORD_RESET_RETRY_TOPIC: identity.password.reset.requested.retry
      PASSWORD_RESET_DLQ_TOPIC: identity.password.reset.requested.dlq
      PASSWORD_RESET_CONSUMER_GROUP: notification-service-password-reset
      PASSWORD_RESET_MAX_ATTEMPTS: "5"
      PROCESSED_EVENTS_RETENTION: 168h
      PROCESSED_EVENTS_CLEANUP_INTERVAL: 1h
      PROCESSED_EVENTS_CLEANUP_BATCH_SIZE: "500"
    ports:
      - "8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  content-service:
    build:
      context: ./server/content-service
      dockerfile: Dockerfile
    container_name: pody-content-service
    environment:
      DATABASE_URL: ${CONTENT_DATABASE_URL:?CONTENT_DATABASE_URL is required}
      PORT: "8082"
      READ_TIMEOUT: 5s
      WRITE_TIMEOUT: 10s
      IDLE_TIMEOUT: 30s
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "8082:8082"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-service:
    build:
      context: ./server/ai-service
      dockerfile: Dockerfile
    container_name: pody-ai-service
    environment:
      DATABASE_URL: ${AI_DATABASE_URL:?AI_DATABASE_URL is required}
      CONTENT_DATABASE_URL: ${CONTENT_DATABASE_URL:?CONTENT_DATABASE_URL is required}
      PORT: "8085"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-2.5-flash}
      GOOGLE_TTS_MODEL: ${GOOGLE_TTS_MODEL:-gemini-2.5-flash-tts}
      GOOGLE_GENAI_BASE_URL: ${GOOGLE_GENAI_BASE_URL:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${GOOGLE_CLOUD_STORAGE_BUCKET:-}
      GOOGLE_CLOUD_STORAGE_PUBLIC_BASE_URL: ${GOOGLE_CLOUD_STORAGE_PUBLIC_BASE_URL:-}
      TRANSCRIPT_ALIGNMENT_MODE: ${TRANSCRIPT_ALIGNMENT_MODE:-mms}
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/application_default_credentials.json
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      NOTIFICATION_INTERNAL_API_KEY: change-me
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_SEARCH_BASE_URL: ${BRAVE_SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-auto}
    ports:
      - "8085:8085"
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/var/secrets/google/application_default_credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-gateway:
    build:
      context: ./server/api-gateway
      dockerfile: Dockerfile
    container_name: pody-api-gateway
    environment:
      PORT: "8080"
      ALLOWED_ORIGINS: "*"
      READ_TIMEOUT: 15s
      WRITE_TIMEOUT: 60s
      IDLE_TIMEOUT: 30s
      SHUTDOWN_TIMEOUT: 10s
      JWT_SECRET: change-me
      IDENTITY_SERVICE_URL: http://identity-service:8081
      CONTENT_SERVICE_URL: http://content-service:8082
      SOCIAL_SERVICE_URL: http://social-service:8083
      ARTICLE_SERVICE_URL: http://article-service:8084
      AI_SERVICE_URL: http://ai-service:8085
      BILLING_SERVICE_URL: http://billing-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports:
      - "8080:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      article-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  article-service:
    build:
      context: ./server/article_service
      dockerfile: Dockerfile
    container_name: pody-article-service
    environment:
      DATABASE_URL: ${ARTICLE_DATABASE_URL:?ARTICLE_DATABASE_URL is required}
      PORT: "8084"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CRAWLER_INTERVAL_MINUTES: "30"
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-5}
      REQUEST_TIMEOUT_SECONDS: "60"
      ENABLE_INITIAL_CRAWL: ${ARTICLE_ENABLE_INITIAL_CRAWL:-true}
      INITIAL_CRAWL_DELAY_SECONDS: ${ARTICLE_INITIAL_CRAWL_DELAY_SECONDS:-20}
      DB_USE_NULL_POOL: ${ARTICLE_DB_USE_NULL_POOL:-true}
      DB_POOL_SIZE: ${ARTICLE_DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${ARTICLE_DB_MAX_OVERFLOW:-4}
    ports:
      - "8084:8084"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      article-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

