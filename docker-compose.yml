services:
  article-postgres:
    image: postgres:16-alpine
    container_name: pody-article-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
    environment:
      POSTGRES_DB: pody_article
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pody_article"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  article-db-init:
    build:
      context: ./server
      dockerfile: article_service/Dockerfile.db-init
    container_name: pody-article-db-init
    environment:
      PGPASSWORD: postgres
      ENABLE_ARTICLE_DEMO_SEED: ${ENABLE_ARTICLE_DEMO_SEED:-true}
    command:
      - /bin/sh
      - -ec
      - |
        until pg_isready -h article-postgres -p 5432 -U postgres -d pody_article; do
          echo "waiting for article-postgres";
          sleep 1;
        done
        psql postgresql://postgres:postgres@article-postgres:5432/pody_article -v ON_ERROR_STOP=1 -f /workspace/sql/article_service.sql
        if [ "$${ENABLE_ARTICLE_DEMO_SEED}" = "true" ]; then
          psql postgresql://postgres:postgres@article-postgres:5432/pody_article -v ON_ERROR_STOP=1 -f /workspace/sql/article_service_demo_seed.sql
        else
          echo "skipping article demo seed"
        fi
    depends_on:
      article-postgres:
        condition: service_healthy
    restart: "no"

  embedding-postgres:
    image: pgvector/pgvector:pg16
    container_name: pody-embedding-postgres
    environment:
      POSTGRES_DB: pody_embedding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pody_embedding"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  embedding-db-init:
    build:
      context: ./server
      dockerfile: embedding_service/Dockerfile.db-init
    container_name: pody-embedding-db-init
    environment:
      PGPASSWORD: postgres
      EMBEDDING_DATABASE_URL: ${EMBEDDING_DATABASE_URL:?EMBEDDING_DATABASE_URL is required}
      EMBEDDING_DB_RESET_ON_INIT: ${EMBEDDING_DB_RESET_ON_INIT:-false}
    command:
      - /bin/sh
      - -ec
      - |
        until pg_isready -h embedding-postgres -p 5432 -U postgres -d pody_embedding; do
          echo "waiting for embedding-postgres";
          sleep 1;
        done
        if [ "$${EMBEDDING_DB_RESET_ON_INIT}" = "true" ]; then
          psql "$${EMBEDDING_DATABASE_URL}" -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS public CASCADE;"
          psql "$${EMBEDDING_DATABASE_URL}" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA public;"
        else
          echo "keeping existing embedding schema"
        fi
        psql "$${EMBEDDING_DATABASE_URL}" -v ON_ERROR_STOP=1 -f /workspace/sql/embedding_service.sql
    depends_on:
      embedding-postgres:
        condition: service_healthy
    restart: "no"

  kafka:
    image: apache/kafka:4.0.0
    container_name: pody-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: pody-debezium-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: debezium.connect.configs
      OFFSET_STORAGE_TOPIC: debezium.connect.offsets
      STATUS_STORAGE_TOPIC: debezium.connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: debezium-connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      article-postgres:
        condition: service_healthy

  debezium-register:
    image: python:3.12-slim
    container_name: pody-debezium-register
    working_dir: /workspace
    volumes:
      - ./debezium:/workspace/debezium:ro
    command: ["python", "/workspace/debezium/register_connector.py"]
    environment:
      DEBEZIUM_CONNECT_URL: http://debezium-connect:8083
      DEBEZIUM_CONNECTOR_FILE: /workspace/debezium/register-connector.json
      DEBEZIUM_CONNECT_STARTUP_TIMEOUT_SECONDS: "120"
      DEBEZIUM_CONNECT_POLL_INTERVAL_SECONDS: "2"
    depends_on:
      debezium-connect:
        condition: service_started
      article-db-init:
        condition: service_completed_successfully
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pody-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
      debezium-connect:
        condition: service_started

  migrations:
    build:
      context: ./server
      dockerfile: migrations/Dockerfile
    container_name: pody-migrations
    environment:
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:?IDENTITY_DATABASE_URL is required}
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?NOTIFICATION_DATABASE_URL is required}
      CONTENT_DATABASE_URL: ${CONTENT_DATABASE_URL:?CONTENT_DATABASE_URL is required}
      AI_DATABASE_URL: ${AI_DATABASE_URL:?AI_DATABASE_URL is required}
      ARTICLE_DATABASE_URL: ${ARTICLE_DATABASE_URL:?ARTICLE_DATABASE_URL is required}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-false}
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: pody-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: pody-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  identity-service:
    build:
      context: ./server/identity-service
      dockerfile: Dockerfile
    container_name: pody-identity-service
    environment:
      PORT: "8081"
      DATABASE_URL: ${IDENTITY_DATABASE_URL:?IDENTITY_DATABASE_URL is required}
      JWT_SECRET: change-me
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      EMAIL_VERIFICATION_TTL: 24h
      PASSWORD_RESET_TTL: 2h
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: identity-service
      KAFKA_WRITE_TIMEOUT: 5s
      OUTBOX_POLL_INTERVAL: 1s
      OUTBOX_BATCH_SIZE: "20"
      OUTBOX_RETENTION: 168h
      OUTBOX_CLEANUP_INTERVAL: 1h
      OUTBOX_CLEANUP_BATCH_SIZE: "200"
      VERIFICATION_EVENTS_TOPIC: identity.email.verification.requested
      EMAIL_VERIFICATION_URL_BASE: ${EMAIL_VERIFICATION_URL_BASE:-http://localhost:8080/verify-email/open}
      PASSWORD_RESET_EVENTS_TOPIC: identity.password.reset.requested
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-283249494920-68vd67ss030ik3v5dbruttgsorn30t97.apps.googleusercontent.com}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET:-identity-avatars}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      IDENTITY_MAX_AVATAR_BYTES: ${IDENTITY_MAX_AVATAR_BYTES:-5242880}
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  notification-service:
    build:
      context: ./server/notification-service
      dockerfile: Dockerfile
    container_name: pody-notification-service
    environment:
      PORT: "8087"
      INTERNAL_API_KEY: change-me
      EMAIL_SENDER_MODE: ${EMAIL_SENDER_MODE:-log}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@pody.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_INSECURE_SKIP_VERIFY: ${SMTP_INSECURE_SKIP_VERIFY:-false}
      SMTP_DIAL_TIMEOUT: ${SMTP_DIAL_TIMEOUT:-10s}
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?NOTIFICATION_DATABASE_URL is required}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_WRITE_TIMEOUT: 5s
      VERIFICATION_EVENTS_TOPIC: identity.email.verification.requested
      VERIFICATION_RETRY_TOPIC: identity.email.verification.requested.retry
      VERIFICATION_DLQ_TOPIC: identity.email.verification.requested.dlq
      VERIFICATION_CONSUMER_GROUP: notification-service
      VERIFICATION_MAX_ATTEMPTS: "5"
      PASSWORD_RESET_EVENTS_TOPIC: identity.password.reset.requested
      PASSWORD_RESET_RETRY_TOPIC: identity.password.reset.requested.retry
      PASSWORD_RESET_DLQ_TOPIC: identity.password.reset.requested.dlq
      PASSWORD_RESET_CONSUMER_GROUP: notification-service-password-reset
      PASSWORD_RESET_MAX_ATTEMPTS: "5"
      PROCESSED_EVENTS_RETENTION: 168h
      PROCESSED_EVENTS_CLEANUP_INTERVAL: 1h
      PROCESSED_EVENTS_CLEANUP_BATCH_SIZE: "500"
    ports:
      - "8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  content-service:
    build:
      context: ./server/content-service
      dockerfile: Dockerfile
    container_name: pody-content-service
    environment:
      DATABASE_URL: ${CONTENT_DATABASE_URL:?CONTENT_DATABASE_URL is required}
      PORT: "8082"
      READ_TIMEOUT: 5s
      WRITE_TIMEOUT: 10s
      IDLE_TIMEOUT: 30s
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "8082:8082"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-service:
    build:
      context: ./server/ai-service
      dockerfile: Dockerfile
    container_name: pody-ai-service
    environment:
      DATABASE_URL: ${AI_DATABASE_URL:?AI_DATABASE_URL is required}
      CONTENT_DATABASE_URL: ${CONTENT_DATABASE_URL:?CONTENT_DATABASE_URL is required}
      PORT: "8085"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-2.5-flash}
      GOOGLE_TTS_MODEL: ${GOOGLE_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      GOOGLE_GENAI_BASE_URL: ${GOOGLE_GENAI_BASE_URL:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_CLOUD_STORAGE_BUCKET: ${GOOGLE_CLOUD_STORAGE_BUCKET:-}
      GOOGLE_CLOUD_STORAGE_PUBLIC_BASE_URL: ${GOOGLE_CLOUD_STORAGE_PUBLIC_BASE_URL:-}
      TRANSCRIPT_ALIGNMENT_MODE: ${TRANSCRIPT_ALIGNMENT_MODE:-mms}
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/application_default_credentials.json
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      NOTIFICATION_INTERNAL_API_KEY: change-me
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_SEARCH_BASE_URL: ${BRAVE_SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-auto}
    ports:
      - "8085:8085"
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/var/secrets/google/application_default_credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-gateway:
    build:
      context: ./server/api-gateway
      dockerfile: Dockerfile
    container_name: pody-api-gateway
    environment:
      PORT: "8080"
      ALLOWED_ORIGINS: "*"
      READ_TIMEOUT: 15s
      WRITE_TIMEOUT: 60s
      IDLE_TIMEOUT: 30s
      SHUTDOWN_TIMEOUT: 10s
      JWT_SECRET: change-me
      IDENTITY_SERVICE_URL: http://identity-service:8081
      CONTENT_SERVICE_URL: http://content-service:8082
      SOCIAL_SERVICE_URL: http://social-service:8083
      ARTICLE_SERVICE_URL: http://article-service:8084
      AI_SERVICE_URL: http://ai-service:8085
      BILLING_SERVICE_URL: http://billing-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports:
      - "8080:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      article-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  article-service:
    build:
      context: ./server/article_service
      dockerfile: Dockerfile
    container_name: pody-article-service
    environment:
      DATABASE_URL: ${ARTICLE_DATABASE_URL:?ARTICLE_DATABASE_URL is required}
      PORT: "8084"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CRAWLER_INTERVAL_MINUTES: "30"
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-5}
      REQUEST_TIMEOUT_SECONDS: "60"
      ENABLE_INITIAL_CRAWL: ${ARTICLE_ENABLE_INITIAL_CRAWL:-true}
      INITIAL_CRAWL_DELAY_SECONDS: ${ARTICLE_INITIAL_CRAWL_DELAY_SECONDS:-20}
      DB_USE_NULL_POOL: ${ARTICLE_DB_USE_NULL_POOL:-true}
      DB_POOL_SIZE: ${ARTICLE_DB_POOL_SIZE:-8}
      DB_MAX_OVERFLOW: ${ARTICLE_DB_MAX_OVERFLOW:-4}
      KAFKA_BROKERS: kafka:9092
      ARTICLE_CATEGORY_SYNC_ENABLED: "true"
      ARTICLE_CATEGORY_SYNC_TOPIC: article.category.matches.generated
      ARTICLE_CATEGORY_SYNC_CLIENT_ID: article-service-category-sync
      ARTICLE_CATEGORY_SYNC_CONSUMER_GROUP: article-service-category-sync
      ARTICLE_CATEGORY_SYNC_AUTO_OFFSET_RESET: earliest
      ARTICLE_CATEGORY_SYNC_TOPIC_PARTITIONS: "1"
      ARTICLE_CATEGORY_SYNC_TOPIC_REPLICATION_FACTOR: "1"
      ARTICLE_CATEGORY_SYNC_REQUEST_TIMEOUT_MS: "30000"
      ARTICLE_CATEGORY_SYNC_SESSION_TIMEOUT_MS: "10000"
      ARTICLE_CATEGORY_SYNC_STARTUP_TIMEOUT_SECONDS: "120"
      ARTICLE_CATEGORY_SYNC_RETRY_DELAY_SECONDS: "2"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_MODEL: ${GOOGLE_GENAI_MODEL:-gemini-2.5-flash}
      GOOGLE_TTS_MODEL: ${GOOGLE_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      GOOGLE_GENAI_BASE_URL: ${GOOGLE_GENAI_BASE_URL:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_SEARCH_BASE_URL: ${BRAVE_SEARCH_BASE_URL:-https://api.search.brave.com/res/v1/web/search}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-auto}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      ARTICLE_PODCAST_BUCKET: ${ARTICLE_PODCAST_BUCKET:-article-podcasts}
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
      article-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      article-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  embedding-service:
    build:
      context: ./server/embedding_service
      dockerfile: Dockerfile
    container_name: pody-embedding-service
    environment:
      EMBEDDING_DATABASE_URL: ${EMBEDDING_DATABASE_URL:?EMBEDDING_DATABASE_URL is required}
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "5"
      DATABASE_STARTUP_TIMEOUT_SECONDS: "120"
      DATABASE_RETRY_DELAY_SECONDS: "2"
      PORT: "8088"
      LOG_LEVEL: ${EMBEDDING_LOG_LEVEL:-INFO}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: embedding-service
      KAFKA_TOPIC: article.embedding.requested
      KAFKA_CONSUMER_GROUP: embedding-service
      KAFKA_AUTO_OFFSET_RESET: earliest
      KAFKA_TOPIC_PARTITIONS: "1"
      KAFKA_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_REQUEST_TIMEOUT_MS: "30000"
      KAFKA_SESSION_TIMEOUT_MS: "10000"
      KAFKA_STARTUP_TIMEOUT_SECONDS: "120"
      KAFKA_RETRY_DELAY_SECONDS: "2"
      ARTICLE_CATEGORY_SYNC_TOPIC: article.category.matches.generated
      OUTBOX_POLL_INTERVAL_SECONDS: "1"
      OUTBOX_BATCH_SIZE: "20"
      CATEGORY_BOOTSTRAP_ENABLED: "true"
      CATEGORY_SOURCE_DATABASE_URL: ${ARTICLE_DATABASE_URL:?ARTICLE_DATABASE_URL is required}
      EMBEDDING_GEMINI_API_KEYS: ${EMBEDDING_GEMINI_API_KEYS:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_GOOGLE_GENAI_BASE_URL: ${EMBEDDING_GOOGLE_GENAI_BASE_URL:-}
      GOOGLE_GENAI_BASE_URL: ${GOOGLE_GENAI_BASE_URL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
      EMBEDDING_OUTPUT_DIMENSIONS: ${EMBEDDING_OUTPUT_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_GEMINI_QUOTA_RETRY_DELAY_SECONDS: ${EMBEDDING_GEMINI_QUOTA_RETRY_DELAY_SECONDS:-60}
      ARTICLE_CHUNK_TARGET_CHARS: ${ARTICLE_CHUNK_TARGET_CHARS:-1400}
      ARTICLE_CHUNK_OVERLAP_CHARS: ${ARTICLE_CHUNK_OVERLAP_CHARS:-180}
      ARTICLE_CHUNK_MIN_CHARS: ${ARTICLE_CHUNK_MIN_CHARS:-250}
      ARTICLE_DEFAULT_LANGUAGE_CODE: ${ARTICLE_DEFAULT_LANGUAGE_CODE:-vi}
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
      article-db-init:
        condition: service_completed_successfully
      article-postgres:
        condition: service_healthy
      embedding-db-init:
        condition: service_completed_successfully
      embedding-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/healthz').getcode() == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

